[package]
name = "rust_jwk_duo"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust port of dart_jwk_duo: a P-256 signing + encryption key duo with JWK, SEC1 hex and HPKE (RFC 9180)."
license = "MIT"

[dependencies]
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "std", "getrandom"] }
hpke = { version = "=0.14.1", default-features = false, features = ["nistp", "aes", "alloc", "getrandom"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "getrandom"] }
sha2 = "0.11"
base64ct = { version = "1.8.3", features = ["alloc"] }
serde_json = "1"
getrandom = "0.4"
rand_core = "0.10"
zeroize = "1"
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
hex = "0.4"
